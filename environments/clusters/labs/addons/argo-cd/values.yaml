# FILE_NAME: values.yaml
# DESCRIPTION: Labs Argo CD — ClusterIP + chart-native HTTPRoute (Envoy Gateway)
# VERSION: 0.3.0

global:
  domain: argocd.devzero.local

server:
  service:
    type: ClusterIP
    annotations: {}
  ingress:
    enabled: false
  ingressGrpc:
    enabled: false
  # Chart-native Gateway API (argo-cd >= 10.x). hostnames must be set;
  # chart only falls back to global.domain when server.listenerset.enabled.
  httproute:
    enabled: true
    labels:
      app.kubernetes.io/part-of: devzero-idp
    parentRefs:
      - name: lab
        namespace: lab-gateway
        sectionName: https
    hostnames:
      - argocd.devzero.local

configs:
  params:
    # TLS terminated at Envoy Gateway
    server.insecure: true
  cm:
    url: https://argocd.devzero.local:8443
    # rootCA = DevZero Lab CA (clusters/lab/certs/ca.crt) — Keycloak TLS
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.devzero.local:8443/realms/idp
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      requestedScopes: ["openid", "profile", "email"]
      rootCA: |
