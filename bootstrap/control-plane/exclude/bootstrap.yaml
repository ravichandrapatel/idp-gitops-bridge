---
# FILE_NAME: bootstrap.yaml
# DESCRIPTION: Hub-only bootstrap — syncs hub AppSets (spoke Argo CD + spoke root apps) into hub Argo CD
# VERSION: 2.0.0
# AUTHORS: ravichandrapatel
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap-addons
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          - cluster: in-cluster
            url: https://kubernetes.default.svc
  template:
    metadata:
      name: bootstrap-hub-addons
    spec:
      project: default
      source:
        repoURL: https://github.com/ravichandrapatel/idp-gitops-bridge.git
        path: bootstrap/control-plane/addons/hub
        targetRevision: HEAD
        directory:
          recurse: false
          include: 'addons-*-appset.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated: {}
