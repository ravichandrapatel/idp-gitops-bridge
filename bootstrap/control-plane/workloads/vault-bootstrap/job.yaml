apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: vault-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: alpine:3.20
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: vault-bootstrap-script
            defaultMode: 0755
