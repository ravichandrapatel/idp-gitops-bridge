apiVersion: batch/v1
kind: Job
metadata:
  name: vault-enable-oidc
  namespace: vault
  labels:
    app.kubernetes.io/part-of: devzero-idp
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: lab-ca
          secret:
            secretName: lab-tls-ca
      containers:
        - name: configure
          image: alpine:3.20
          volumeMounts:
            - name: lab-ca
              mountPath: /ca
              readOnly: true
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-bootstrap
                  key: root_token
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-oidc
                  key: clientID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vault-oidc
                  key: clientSecret
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              apk add --no-cache curl jq >/dev/null
              echo "[T-01] enable oidc auth"
              curl -s -X POST -H "X-Vault-Token: $VAULT_TOKEN" -d '{"type":"oidc"}' "$VAULT_ADDR/v1/sys/auth/oidc" >/dev/null || true

              # Discovery URL must equal Keycloak issuer (OIDC library enforces match).
              DISCOVERY="https://keycloak.devzero.local:8443/realms/idp"
              curl -sf --cacert /ca/ca.crt "$DISCOVERY/.well-known/openid-configuration" >/dev/null
              echo "discovery=$DISCOVERY"

              BODY=$(jq -n \
                --arg id "$OIDC_CLIENT_ID" \
                --arg secret "$OIDC_CLIENT_SECRET" \
                --arg d "$DISCOVERY" \
                --rawfile ca /ca/ca.crt \
                '{
                  oidc_discovery_url: $d,
                  oidc_client_id: $id,
                  oidc_client_secret: $secret,
                  default_role: "default",
                  bound_issuer: $d,
                  oidc_discovery_ca_pem: $ca
                }')

              echo "[T-02] write oidc config"
              curl -sf -X POST -H "X-Vault-Token: $VAULT_TOKEN" -H 'Content-Type: application/json' \
                -d "$BODY" "$VAULT_ADDR/v1/auth/oidc/config"

              curl -sf -X POST -H "X-Vault-Token: $VAULT_TOKEN" -H 'Content-Type: application/json' \
                -d '{"user_claim":"sub","allowed_redirect_uris":["https://vault.devzero.local:8443/ui/vault/auth/oidc/oidc/callback","http://localhost:8250/oidc/callback"],"role_type":"oidc","policies":["default"],"ttl":"1h"}' \
                "$VAULT_ADDR/v1/auth/oidc/role/default"
              echo "[T-03] vault oidc configured"
