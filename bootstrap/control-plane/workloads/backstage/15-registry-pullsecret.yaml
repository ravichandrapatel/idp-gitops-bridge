# PLACEHOLDER — registry pull credentials must not live in git.
# Create the dockerconfig Secret out-of-band (CI OIDC, ExternalSecrets, or sealed-secret).
# Example shape only:
# apiVersion: v1
# kind: Secret
# metadata:
#   name: ghcr-pull
#   namespace: backstage
# type: kubernetes.io/dockerconfigjson
# data:
#   .dockerconfigjson: <base64>
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: backstage
  annotations:
    note: "Replace via private overlay or ExternalSecrets before apply"
type: Opaque
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"REPLACE_WITH_BASE64_USER_PAT"}}}'
