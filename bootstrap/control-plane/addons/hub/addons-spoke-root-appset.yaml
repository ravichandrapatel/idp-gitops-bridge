---
# FILE_NAME: addons-spoke-root-appset.yaml
# DESCRIPTION: Hub pushes spoke root Applications (addons + NaaS) onto clusters with enable_argocd=true
# VERSION: 1.0.0
# AUTHORS: ravichandrapatel
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-spoke-root
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: enable_argocd
              operator: In
              values: ['true']
  template:
    metadata:
      name: 'spoke-root-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "8"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}bootstrap/spoke/root-apps'
        directory:
          recurse: true
          include: '*.yaml'
      destination:
        name: '{{name}}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
