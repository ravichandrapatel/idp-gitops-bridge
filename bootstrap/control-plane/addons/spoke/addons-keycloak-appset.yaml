---
# SPOKE-OWNED: reconciled by spoke Argo CD (in-cluster). Not hub-pushed.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-keycloak
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: enable_keycloak
              operator: In
              values: ['true']
  template:
    metadata:
      name: addon-{{name}}-keycloak
      annotations:
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}bootstrap/control-plane/workloads/keycloak'
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: keycloak
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
