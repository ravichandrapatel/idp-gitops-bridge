---
# SPOKE-OWNED: reconciled by spoke Argo CD (in-cluster). Not hub-pushed.
# FILE_NAME: addons-backstage-appset.yaml
# DESCRIPTION: Deploy Backstage from Gitea Helm package registry when enable_backstage=true
# VERSION: 0.2.0
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-backstage
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: backstage
                addonChartNamespace: backstage
                addonChartVersion: 0.1.2
                addonChartRepository: https://gitea.devzero.local:8443/api/packages/giteaAdmin/helm
              selector:
                matchExpressions:
                  - key: enable_backstage
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: staging
              values:
                addonChartVersion: 0.1.2
          - clusters:
              selector:
                matchLabels:
                  environment: prod
              values:
                addonChartVersion: 0.1.2
  template:
    metadata:
      name: addon-{{name}}-{{values.addonChart}}
      annotations:
        argocd.argoproj.io/sync-wave: "8"
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/{{values.addonChart}}/values.yaml
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/{{metadata.labels.environment}}/addons/{{values.addonChart}}/values.yaml
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/clusters/{{name}}/addons/{{values.addonChart}}/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{values.addonChartNamespace}}'
      # Controllers/API default fields that would otherwise keep the app OutOfSync
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .status
            - .metadata.generation
            - .metadata.finalizers
            - .spec.data[].remoteRef.conversionStrategy
            - .spec.data[].remoteRef.decodingStrategy
            - .spec.data[].remoteRef.metadataPolicy
            - .spec.target.deletionPolicy
            - .spec.target.template.engineVersion
            - .spec.target.template.mergePolicy
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - .status
            - .spec.parentRefs[].group
            - .spec.parentRefs[].kind
            - .spec.rules[].backendRefs[].group
            - .spec.rules[].backendRefs[].kind
            - .spec.rules[].backendRefs[].weight
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
