---
# SPOKE-OWNED: reconciled by spoke Argo CD (in-cluster). Not hub-pushed.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-envoy-gateway
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: gateway-helm
                addonChartNamespace: envoy-gateway-system
                # anything not staging or prod use this version
                addonChartVersion: v1.8.3
                addonChartRepository: docker.io/envoyproxy
              selector:
                matchExpressions:
                  - key: enable_envoy_gateway
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: staging
              values:
                addonChartVersion: v1.8.3
          - clusters:
              selector:
                matchLabels:
                  environment: prod
              values:
                addonChartVersion: v1.8.3
  template:
    metadata:
      name: addon-{{name}}-envoy-gateway
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: eg
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/envoy-gateway/values.yaml
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/{{metadata.labels.environment}}/addons/envoy-gateway/values.yaml
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/clusters/{{name}}/addons/envoy-gateway/values.yaml
      destination:
        namespace: '{{values.addonChartNamespace}}'
        server: https://kubernetes.default.svc
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true  # Big CRDs.
